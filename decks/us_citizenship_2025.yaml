# US Citizenship Test 2025 Deck
# Version history:
# - v1: Initial release with 20 questions (placeholder)
# - v2: Complete release with all 128 civics questions for the naturalization test
# - v4: Remove duplicate/invalid tribes from civ2025_115 (Teton removed, duplicates deduplicated)
# - v5: Force update on devices where deck_versions was bumped but deck save failed (stuck at v2)
